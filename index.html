const initial=()=>({step:0,occasion:'',guests:30,date:'',time:'',budget:25,drinks:[0,0,0,0],food:Array(9).fill(0),extras:[false,false,false,false],name:'',email:'',phone:'',privacy:false,done:false,history:[]});let s=initial();try{let old=JSON.parse(localStorage.getItem('done-occasions-demo-v1'));if(old&&Array.isArray(old.food))s={...s,...old}}catch(e){};s.extras=[0,1,2,3].map(i=>!!s.extras[i]);const $=id=>document.getElementById(id), money=n=>Number(n).toLocaleString('it-IT',{style:'currency',currency:'EUR'}), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const g=()=>Math.max(1,Number(s.guests)||1), beverage=()=>drinks.reduce((a,d,i)=>a+d[2]*s.drinks[i],0), foodTotal=()=>food.reduce((a,d,i)=>a+d[2]*s.food[i],0), extraCost=i=>i===2?2*s.drinks[2]*g():i===3?0:extras[i][2]*g(), extraTotal=()=>extras.reduce((a,d,i)=>a+(s.extras[i]?extraCost(i):0),0), total=()=>beverage()*g()+foodTotal()+extraTotal(), target=()=>s.budget*g();function save(){try{const copy={...s,name:'',email:'',phone:'',privacy:false,done:false};if(copy.step===8)copy.step=7;localStorage.setItem('done-occasions-demo-v1',JSON.stringify(copy))}catch(e){}}function record(){s.history.push({at:new Date().toISOString(),step:s.step,budget:s.budget,guests:g(),total:total()});save()}function choose(k,v){s[k]=v;save();render()}function change(k,i,d){const unit=k==='food'&&i>=7?g():1;s[k][i]=Math.max(0,Math.min(k==='food'?Math.max(999,unit*20):20,s[k][i]+d*unit));if(!s.drinks[2])s.extras[2]=false;save();render()}function field(k,v){if(k==='guests'&&!s.tapasGroups)s.tapasGroups=s.food.slice(7).map(q=>Math.ceil(q/g()));s[k]=v;save()}function go(n){if(n<8)s.done=false;s.step=n;record();render();window.scrollTo(0,0)}function next(){let err='';if(s.step===1&&(!s.occasion||!Number.isInteger(Number(s.guests))||Number(s.guests)<1||Number(s.guests)>500))err='Scegli un’occasione e indica da 1 a 500 ospiti.';if(s.step===2&&s.budget>30)return;if(s.step===7){if(!s.n Ora hai una prima idea. Parliamone insieme: <a class="call" href="tel:+393496733755">349 673 3755</a>.</div>`}if(st===5){a=title('05 / The final touch','Quel qualcosa in più.','Aggiungi un ultimo dettaglio, se ti va.')+extras.map((d,i)=>i===2&&!s.drinks[2]?'':`<button class="option full ${s.extras[i]?'on':''}" onclick="s.extras[${i}]=!s.extras[${i}];save();render()" aria-pressed="${s.extras[i]}"><strong>${s.extras[i]?'✓ ':''}${i===2?'E se i tuoi drink fossero quelli della nostra drink list?':i===3?'Un dolcino per chiudere la serata?':d[0]}</strong><span class="small">${i===3?'Lasciati tentare dai nostri '+d[1]+'.':d[1]}</span><div class="extra-price">${i===3?'Prezzo da concordare · '+(s.extras[i]?'Richiesto':'Aggiungi alla richiesta'):i===2?'+ 2 € per cocktail classico · '+money(extraCost(i)/g())+' / ospite':'+ '+money(d[2])+' / ospite'}</div></button>`).join('')+`<div class="panel"><div class="small">La tua proposta attuale${s.extras[3]?' · dolce escluso':''}</div><div class="metrics"><b>${money(total()/g())} / ospite</b></div><div class="small">${money(total())} complessivi</div></div>`}if(st===6){a=title('06 / Your occasion','La tua festa prende forma.','Puoi tornare indietro e modificare le tue scelte.')+compactSummary()+`<div class="panel price-focus"><div class="small">LA TUA PROPOSTA INDICATIVA · A PERSONA</div><b>${money(total()/g())}</b><div class="small">${money(total())} complessivi · ${g()} ospiti${s.extras[3]?' · dolce da concordare, escluso':''}</div></div><p class="notice">Importi indicativi, soggetti a disponibilità e conferma del D.ONE.</p>`}if(st===7){a=title('07 / Restiamo in contatto','Porta con te la tua proposta.','Lascia i tuoi recapiti per ricevere la proposta completa via email. Nessun impegno.')+`<div class="contact-notice">La proposta non garantisce la disponibilità della data. Contattaci per verificare la disponibilità e concordare insieme modalità e dettagli: <a class="call" href="tel:+393496733755">349 673 3755</a>.</div><label class="f ;if(st===3||st===4){const panel=app.querySelector('.panel');const head=app.querySelector('.stage-head');const catalog=document.createElement('div');catalog.className='catalog';for(const el of Array.from(app.children)){if(el!==head&&el!==panel)catalog.appendChild(el)}app.appendChild(panel);app.appendChild(catalog);if(previous===String(st))catalog.scrollTop=oldScroll;}}function buildQuote(){return '<img class="print-logo" src="logo.png" alt="D.ONE Torino"><h1>La tua proposta</h1>'+line('Nome e cognome',esc(s.name))+line('Email',esc(s.email))+line('Telefono',esc(s.phone||'Non indicato'))+summary()+'<p>Proposta indicativa, non vincolante. La data non è confermata. Contattaci al 349 673 3755 per verificare la disponibilità e concordare modalità e dettagli.</p>'}function printQuote(){if(!s.done)return;$('print').innerHTML=buildQuote();window.print()}render();</script></body></html>
