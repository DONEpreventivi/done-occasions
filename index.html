))):'').join(''):'')+line('Totale indicativo',money(total()))+line('A persona',money(total()/g()))}function render(){let a='',f='',st=s.step;document.documentElement.style.setProperty('--stage',['#efefed','#ffd362','#f3b6e8','#8ca6d5','#81946b','#e9a77d','#bfb3af','#ffd362','#efefed'][st]||'#efefed');$('progress').style.width=(st/8*100)+'%';$('stepLabel').textContent=st===0?'EVENTS / TORINO':st===8?'COMPLETATO':String(st).padStart(2,'0')+' / 07';if(st===0){a=`<div class="hero"><div class="eyebrow">The art of celebrating</div><h1>La tua festa.<br>A modo tuo.</h1><p>Le persone, i cocktail, la cucina. Componi la tua occasione al D.ONE, scegliendo ciò che ti piace davvero.</p></div><div class="index-board"><div class="index-row" style="background:#ffd362"><span class="index-num">01</span><div><strong>Occasion</strong><small>Cosa festeggiamo?</small></div><svg viewBox="0 0 38 38" aria-hidden="true"><path d="M5 28L14 7l13 13-22 8zM20 8l3-4M27 12l5-2M25 2l1 2"/></svg></div><div class="index-row" style="background:#f3b6e8"><span class="index-num">02</span><div><strong>Budget</strong><small>Da dove partiamo?</small></div><svg viewBox="0 0 38 38" aria-hidden="true"><rect x="4" y="8" width="29" height="22" rx="3"/><path d="M4 14h29M24 22h5"/></svg></div><div class="index-row" style="background:#8ca6d5"><span class="index-num">03</span><div><strong>Drinks</strong><small>Nel bicchiere.</small></div><svg viewBox="0 0 38 38" aria-hidden="true"><path d="M5 5h28L19 21 5 5zM19 21v11M10 32h18M10 11h18"/></svg></div><div class="index-row" style="background:#81946b"><span class="index-num">04</span><div><strong>Food</strong><small>A tavola, a modo tuo.</small></div><svg viewBox="0 0 38 38" aria-hidden="true"><path d="M6 5v12q0 5 5 5t5-5V5M11 5v28M28 5q-8 8-6 16h6M28 5v28"/></svg></div><div class="index-row" style="background:#e9a77d"><span class="index-num">05</span><div><strong>Extras</strong><small>Quel qualcosa in più.</small></div><svg viewBox="0 0 38 38" aria-hidden="true"><path d=
